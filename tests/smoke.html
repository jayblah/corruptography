<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Smoke test</title>
<style>body{font:14px/1.4 system-ui;margin:16px}iframe{width:1400px;height:900px;border:1px solid #888}.fail{color:#b00020}.pass{color:#0a7d2c}</style></head>
<body>
<!-- Open this file in a browser (or serve the folder); it loads the real page in a frame and checks it.
     The title becomes PASS or FAIL; headless Chrome can read it with --dump-dom (see .github/workflows/checks.yml). -->
<h1>Smoke test</h1>
<pre id="out">running…</pre>
<iframe id="app" src="../index.html" title="page under test"></iframe>
<script src="../people.js"></script>
<script src="../data.js"></script>
<script>
const frame = document.getElementById('app'), out = document.getElementById('out');
const results = [];
const check = (name, ok, detail) => results.push({ name, ok: !!ok, detail });
const wait = ms => new Promise(r => setTimeout(r, ms));

frame.addEventListener('load', async () => {
  try {
    const win = frame.contentWindow, doc = win.document;
    await wait(300);
    const $ = s => doc.querySelector(s), $$ = s => [...doc.querySelectorAll(s)];
    const N = DATA.nodes, E = DATA.edges; // the page's own data, loaded below (the page's policy forbids reading it with eval)
    const dimmed = () => $$('.card.dim, .card.gone').length; // greyed (hover, selection) or hidden (filter, search)
    const shown = () => $$('.card').length - dimmed();
    const expected = test => Object.values(N).filter(test).length + (test(N[DATA.hub]) ? 0 : 1); // the hub never dims, so it is always shown

    // structure
    check('one card per node', $$('.card').length === Object.keys(N).length, `${$$('.card').length} cards, ${Object.keys(N).length} nodes`);
    check('every card has a name button', $$('.card .n').every(b => b.textContent.trim()));
    check('footer correction link points at the repo issues', /github\.com\/.+\/issues\/new/.test($('#report').href));
    check('page has a description and favicon', !!doc.querySelector('meta[name=description]') && !!doc.querySelector('link[rel=icon]'));
    check('legend explains marks and lines', $$('#legend .lrow').length === 2 && $$('#legend .lrow:last-child .lg').length >= 4);

    // each group's name is a tab on its first card that is showing, filtered or not
    const tabsOk = () => {
      const cats = [...new Set($$('.card:not(.gone)').map(c => c.className.match(/cat-(\w+)/)[1]))].filter(k => k !== N[DATA.hub].cat);
      return $$('.glabel').length === cats.length && cats.every(k => $$('.glabel').some(l => l.dataset.cat === k && l.parentElement === $$(`.card.cat-${k}:not(.gone)`)[0]));
    };
    check('each group has one name tab, on its first card', tabsOk(), `${$$('.glabel').length} tabs`);
    $('.chip[data-f=fund]').click();
    check('a filter keeps a tab on the first card of each group still showing', tabsOk() && $$('.glabel').length > 0, `${$$('.glabel').length} tabs`);
    $('#count [data-clear]').click();
    check('a card has its party badge in its badge row, not a corner', !!$('.card[data-id=Musk] .pills .pill[aria-label=Republican]') && !$(".card:not(.hero) .hd > .party"));

    // filters, badges and the result count
    const chip = id => $(`.chip[data-f="${id}"], input[data-f="${id}"]`); // a chip, or a checkbox in a dropdown
    chip('anti').click();
    const isNet = id => N[id].cat === 'net' || E.some(e => (e.a === id && N[e.b].cat === 'net') || (e.b === id && N[e.a].cat === 'net'));
    const antiExpected = expected(n => n.anti || isNet(n.id));
    check('anti-democracy chip spotlights the flagged cards', shown() === antiExpected, `${shown()} shown, expected ${antiExpected}`);
    check('result count is shown', /of \d+ shown/.test($('#count').textContent), $('#count').textContent);
    check('the status line names the active filter', $('#count').textContent.includes('Anti-Democracy'), $('#count').textContent);
    $('#count [data-clear]').click();
    check('the status line has a Clear button', dimmed() === 0 && $('#count').textContent === '');
    chip('anti').click();
    chip('anti').click();
    check('clicking the chip again clears the filter', dimmed() === 0 && $('#count').textContent === '');
    check('cards leave the dates to the details view', ![...$$('.card .r')].some(r => /\((?:[A-Z][a-z]{2} )?\d{4}/.test(r.textContent)));
    chip('dem').click();
    check('the Dem filter finds the cards marked Democrat or both', shown() === expected(n => n.party === 'dem' || n.party === 'both'), `${shown()} shown`);
    chip('dem').click();
    chip('gop').click();
    check('the GOP filter finds the cards marked GOP', shown() === expected(n => n.party === 'gop' || n.party === 'both'), `${shown()} shown`);
    chip('gop').click();
    const badge = $('.card .pill.only');
    check('a card badge is display only: it carries no filter', !badge.hasAttribute('data-f'));
    check('card badges are labelled images, not tab stops', badge.getAttribute('role') === 'img' && !!badge.getAttribute('aria-label'));
    chip('fund').click();
    chip('crypto').click();
    check('chips combine: a card must match every chosen filter', shown() === expected(n => n.fund && n.crypto) && chip('fund').getAttribute('aria-pressed') === 'true' && $('#count').textContent.includes(' + '), `${shown()} shown; ${$('#count').textContent}`);
    $('#count [data-clear]').click();
    check('Clear resets all the chosen filters', dimmed() === 0 && chip('crypto').getAttribute('aria-pressed') === 'false' && chip('fund').getAttribute('aria-pressed') === 'false');

    // dropdowns: a group of checkboxes; any chosen option matches
    const menu = id => $(`#dd-${id}`), opener = id => $(`[data-dd=${id}]`);
    check('the dropdown menus start closed', $$('.ddmenu').every(m => m.hidden) && opener('power').getAttribute('aria-expanded') === 'false');
    opener('power').click();
    check('opening Power shows its options', !menu('power').hidden && menu('power').querySelectorAll('input').length === DATA.govKinds.length && opener('power').getAttribute('aria-expanded') === 'true');
    opener('politics').click();
    check('opening another dropdown closes the first', menu('power').hidden && !menu('politics').hidden);
    doc.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    check('Escape closes an open dropdown', menu('politics').hidden);
    opener('power').click();
    doc.body.click();
    check('a click elsewhere closes the menu', menu('power').hidden);
    const kindCount = k => Object.values(N).filter(n => n.gov && n.gov.kinds.includes(k)).length;
    chip('gov:official').click();
    const only = shown();
    chip('gov:contractor').click();
    const either = expected(n => n.gov && (n.gov.kinds.includes('official') || n.gov.kinds.includes('contractor')));
    check('a chosen option narrows Power, and two options show either', only >= kindCount('official') && shown() === either, `${only} then ${shown()}, expected ${either}`);
    check('the dropdown button shows how many options are on', opener('power').textContent.includes('(2)') && opener('power').classList.contains('on'));
    chip('gov:official').click();
    chip('gov:contractor').click();
    check('unchecking every option clears the filter', dimmed() === 0 && !opener('power').classList.contains('on'));
    chip('gop').click();
    chip('dem').click();
    check('Politics with both parties on shows every card with a party', shown() === expected(n => n.party), `${shown()} shown`);
    chip('gop').click();
    chip('dem').click();

    // search
    const q = $('#q');
    q.value = 'yarvin'; q.dispatchEvent(new win.Event('input'));
    check('search finds cards by name and by connection text', shown() >= 2, `${shown()} shown`);
    q.value = 'zzzzzz'; q.dispatchEvent(new win.Event('input'));
    check('search with no hits says so', $('#count').textContent.includes('No matches'));
    q.value = ''; q.dispatchEvent(new win.Event('input'));
    check('clearing the search restores everything', dimmed() === 0);

    // selecting a card: details, page references, address bar, connection lines
    $('.card[data-id=Vance] .n').click();
    check('pinning a card opens its details dialog', $('#cardBody h2').textContent === 'JD Vance');
    check('pinning writes the card into the address', win.location.hash.includes('card=Vance'));
    check('connection lines are drawn from card borders', $$('#stage path.edge').length === E.filter(e => e.a === 'Vance' || e.b === 'Vance').length);
    check('source links end in an arrow icon, not a text badge', $$('#cardBody .srcl .ext').length > 0 && !$('#cardBody .srcl i'));
    check('card dialog offers a correction link', !!$('#cardBody a.wl[href*="issues/new"]'));

    // how is A connected to B
    const sel = $('#pathSel');
    sel.value = 'Musk'; sel.dispatchEvent(new win.Event('change', { bubbles: true }));
    check('a path is found and listed', $$('#pathResult .con').length >= 2, $('#pathResult').textContent.slice(0, 80));
    check('the path is written into the address', /to=Musk/.test(win.location.hash));
    const via = $('#pathResult [data-via]');
    if (via) {
      const before = $$('#pathResult .con').length;
      $$('#pathResult [data-via]').find(b => !b.classList.contains('on')).click();
      check('the route can switch between "without Thiel" and "via Thiel"', $$('#pathResult .con').length !== before || /via=any/.test(win.location.hash));
    }
    win.location.hash = '#card=Yarvin&to=Vance&filter=crypto';
    await wait(100);
    check('the address restores a card, a path and a filter', $('#cardBody h2').textContent === 'Curtis Yarvin' && $('#pathSel').value === 'Vance' && $(`.chip[data-f=crypto]`).classList.contains('on'));
    doc.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    check('Escape clears the selection and the address', !$('.card.sel') && !win.location.hash.includes('card='));
    check('unpinning leaves no stale pressed state on card names', !$$('.card .n[aria-pressed]').length);

    // the hub's many connections are grouped by kind of tie, not drawn as a star
    win.location.hash = '#card=T';
    await wait(100);
    const hubCons = E.filter(e => e.a === DATA.hub || e.b === DATA.hub).length;
    check('the hub card groups its connections by kind of tie', $$('#cardBody .grp').length >= 3 && $$('#cardBody .tile').length === hubCons && !$('#cardBody svg.graph'), `${$$('#cardBody .grp').length} groups, ${$$('#cardBody .tile').length} tiles, ${hubCons} connections`);
    win.location.hash = '';
    await wait(50);

    // hover preview acts once per card, not per child element
    const card = $('.card[data-id=Yarvin]');
    win.location.hash = '';
    await wait(50);
    card.dispatchEvent(new win.MouseEvent('mouseover', { bubbles: true, relatedTarget: doc.body }));
    const lines = () => $('#ov').innerHTML;
    const drawn = lines();
    card.querySelector('.n').dispatchEvent(new win.MouseEvent('mouseout', { bubbles: true, relatedTarget: card.querySelector('.s') || card }));
    check('moving within a card keeps its connections drawn', drawn !== '' && lines() === drawn);
    card.dispatchEvent(new win.MouseEvent('mouseout', { bubbles: true, relatedTarget: doc.body }));
    check('leaving the card clears them', lines() === '');

    // a connection scrolled out of view is named in a strip, and the strip goes with the lines
    const view = $('#view'), lastCard = $$('.card').filter(c => !c.classList.contains('hero')).pop();
    view.scrollTop = view.scrollHeight;
    await wait(50);
    lastCard.dispatchEvent(new win.MouseEvent('mouseover', { bubbles: true, relatedTarget: doc.body }));
    check('a connection scrolled off the top is named in a strip under the header', !$('#offUp').hidden && $('#offUp .offpill b').textContent === N[DATA.hub].name, $('#offUp').textContent);
    lastCard.dispatchEvent(new win.MouseEvent('mouseout', { bubbles: true, relatedTarget: doc.body }));
    check('the strip clears when the lines do', $('#offUp').hidden && $('#offDown').hidden);
    view.scrollTop = 0;
  } catch (e) {
    check('test ran without an exception', false, String(e && e.stack || e));
  }
  const failed = results.filter(r => !r.ok);
  out.innerHTML = results.map(r => `<span class="${r.ok ? 'pass' : 'fail'}">${r.ok ? 'PASS' : 'FAIL'}</span> ${r.name}${r.ok ? '' : ' — ' + (r.detail || '')}`).join('\n')
    + `\n\n${results.length - failed.length}/${results.length} passed`;
  out.dataset.result = failed.length ? 'FAIL' : 'PASS';
  document.title = failed.length ? 'FAIL' : 'PASS';
});
</script>
</body></html>
